/* Layout: faixa de campanha no topo, vitrine em grade, barra de sacola fixa embaixo, pedido em painel deslizante. Visual único (claro) por escolha: é a paleta da campanha. */
:root{
  --blush:#F7C6CC; --oliva:#C3CC4E; --militar:#3F5B16; --laranja:#FF6B1A; --vinho:#790808;
  --papel:#FFFFFF; --rosa-capa:#FAD7DE; --bege:#FCF5E6; --cartao:#FFFFFF; --tinta:#263510; --tinta-suave:#5B6A45; --linha:#EDDCDC;
  --display:"Borne Celine","Josefin Sans",Georgia,serif;
  --texto:"Josefin Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* prévias das letras das peças: aproximações das fontes de produção */
  --letra-laco:"Allura","Brush Script MT",cursive;
  --letra-qn:"Playfair Display",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--rosa-capa);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.5;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demo{background:var(--militar);color:#fff;font-size:13px;font-weight:600}
.demo .wrap{padding-block:8px}

.topo{position:relative;overflow:hidden;background:var(--rosa-capa)}
.topo .chip{background:#FFFFFF}
.topo .wrap{position:relative;padding-block:28px 12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:end}
.topo-txt{display:grid;gap:12px;padding-bottom:28px}
.marca{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--militar)}
.lettering{width:100%;max-width:520px;height:auto;display:block}
.assina{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,26px);color:var(--vinho);margin:0;max-width:26ch;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--blush);color:var(--tinta);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.qn-topo{width:100%;max-width:340px;justify-self:center;display:block}
.qn-mov{position:relative;transform-origin:50% 8%}
.qn-mov img{width:100%;height:auto;display:block}
.lz{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;opacity:0;--c:255,120,90}
.lz.r{--c:255,90,80}.lz.o{--c:255,170,70}.lz.g{--c:205,240,120}.lz.p{--c:255,190,215}
.lz{background:radial-gradient(circle,rgba(var(--c),.95) 0 22%,rgba(var(--c),.45) 45%,rgba(var(--c),0) 70%)}
@media (prefers-reduced-motion:no-preference){
  .lz{animation:pisca 2.6s ease-in-out infinite;animation-delay:var(--d)}
  .qn-mov{animation:balanca 6s ease-in-out infinite}

const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");

try{const s=JSON.parse(localStorage.getItem("ese-sacola2")||"null");if(Array.isArray(s))sacola=s.filter(i=>prod(i.pid)&&precoDe(prod(i.pid),i.tam)!=null);}catch(e){}

const qtdDe = pid => sacola.filter(i=>i.pid===pid).reduce((s,i)=>s+i.qtd,0);
const precoItem = i => {const p=prod(i.pid);if(p.precoLote&&qtdDe(i.pid)>=p.precoLote.min)return p.precoLote.preco;return precoDe(p,i.tam);};
const subtotal = () => sacola.reduce((s,i)=>s+precoItem(i)*i.qtd,0);
const totalQtd = () => sacola.reduce((s,i)=>s+i.qtd,0);

function previewHTML(p,e){
  const st=`background:${fundoFil(e.fundo)};color:${hexFil(e.cornome)};${p.peca==="bola"?`box-shadow:0 0 0 7px ${hexFil(e.cornome)}`:""}`;
  const cls=`prev ${p.peca==="bengala"?"bengala":""} ${p.peca==="bengala"?"laco":e.letra}`;
  if(p.peca==="bola"&&e.letra==="composto")
    return `<div class="${cls}" style="${st}"><span><span class="l1">${esc(e.nome||"Maria")}</span><span class="l2">${esc(e.nome2||"Eduarda")}</span></span></div>`;
  return `<div class="${cls}" style="${st}"><span class="l1">${esc(e.nome||"Seu nome")}</span></div>`;
}
function selCor(p,campo,rot,e){
  const v=e[campo],f=FIL.find(x=>x.n===v)||{};
  const aberto=!!(e.mais&&e.mais[campo])||!f.c;
  const bt=x=>`<button class="cor" data-campo="${campo}" data-v="${esc(x.n)}" style="background:url(assets/fil/${slugCor(x.n)}.webp) center/cover, ${x.h}" aria-label="${esc(x.n)}" aria-pressed="${x.n===v}" title="${esc(x.n)}"></button>`;
  return `<div class="campo"><span class="rot">${rot}: <span style="text-transform:none;letter-spacing:0">${esc(v)}</span></span>
    <div class="sel-cor">${FIL.filter(x=>x.c).map(bt).join("")}</div>
    ${aberto?`<span class="grupo-cor">Outras cores</span><div class="sel-cor">${FIL.filter(x=>!x.c).map(bt).join("")}</div>`
            :`<button class="mais-cores" data-mais="${campo}">+ ver mais ${FIL.filter(x=>!x.c).length} cores</button>`}
    ${f.teste?`<span class="aviso-cor">Essa cor muda bastante com a luz. A gente confirma com você pelo WhatsApp antes de imprimir.</span>`:""}</div>`;
}
function cardHTML(p){
  const e=escolha[p.id];
  const preco=precoDe(p,e.tam);
  const tSel=p.tamanhos.find(t=>t.id===e.tam)||p.tamanhos[0];
  const nomes=p.peca?`
      ${p.peca==="bola"?`<div class="campo"><span class="rot">Letra</span><span style="font-size:14px">Laço · cursiva</span></div>`:""}
      <div class="campo"><label class="rot" for="nome-${p.id}">${p.peca==="bola"&&e.letra==="composto"?"1º nome":"Nome"}</label>
        <input type="text" id="nome-${p.id}" data-n="nome" maxlength="40" value="${esc(e.nome)}" placeholder="Ex.: Sofia" autocomplete="off"></div>
      ${p.peca==="bola"&&e.letra==="composto"?`<div class="campo"><label class="rot" for="nome2-${p.id}">2º nome</label><input type="text" id="nome2-${p.id}" data-n="nome2" maxlength="9" value="${esc(e.nome2)}" autocomplete="off"></div>`:""}
      ${selCor(p,"fundo","Cor da peça",e)}
      ${selCor(p,"cornome",p.peca==="bola"?"Cor do nome e da borda":"Cor do nome",e)}
      ${previewHTML(p,e)}
      <span class="prev-nota">Prévia aproximada. A letra e a cor do filamento podem variar um pouco.</span>
      <span class="erro" hidden></span>`:"";
  return `
  <article class="prod" data-id="${p.id}">
    <div class="arte ${p.foto?"com-foto":(p.peca?"":"sem-foto")}" style="--fundo:${p.fundo}"><img src="assets/${p.imgs?p.imgs[e.foto||0]:p.img}" alt="${esc(p.nome)}" loading="lazy">${p.imgs&&p.imgs.length>1?`<div class="fotos-nav">${p.imgs.map((_,k)=>`<button class="ponto" data-foto="${k}" aria-label="Foto ${k+1} de ${p.imgs.length}" aria-pressed="${k===(e.foto||0)}"></button>`).join("")}</div><button class="foto-prox" data-foto="${((e.foto||0)+1)%p.imgs.length}" aria-label="Próxima foto"></button>`:""}${p.foto||p.peca?"":'<span class="breve">Foto da peça em breve</span>'}</div>
    <div class="corpo">
      <h3>${esc(p.nome)}</h3>
      <p>${esc(p.desc)}</p>
      <p class="medida"><strong>Tamanho:</strong> ${esc(tSel.medida)}</p>
      ${preco==null?'<div class="sem-preco">Preço em breve</div>':`<div class="preco">${brl(preco)}</div>${p.precoLote?`<div class="lote">A partir de ${p.precoLote.min} bolas, ${brl(p.precoLote.preco)} cada</div>`:""}`}
      ${p.tamanhos.length>1?`<div class="campo"><span class="rot">Tamanho</span><div class="opcoes">${p.tamanhos.map(t=>`<button class="op" data-tam="${t.id}" aria-pressed="${t.id===e.tam}">${esc(t.label)}${t.preco!=null?` <small>· ${brl(t.preco)}</small>`:""}</button>`).join("")}</div></div>`:""}
      ${p.opcao?`<div class="campo"><span class="rot">${esc(p.opcao.rot)}</span><div class="opcoes">${p.opcao.vals.map(v=>`<button class="op" data-op="${esc(v)}" aria-pressed="${v===e.op}" ${tSel.soUso&&v!==tSel.soUso?"disabled":""}>${esc(v)}</button>`).join("")}</div></div>`:""}
      ${p.opcao2&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam)?`<div class="campo"><span class="rot">${esc(p.opcao2.rot)}</span><div class="opcoes">${p.opcao2.vals.map(v=>`<button class="op" data-op2="${esc(v)}" aria-pressed="${v===e.op2}">${esc(v)}</button>`).join("")}</div>
        ${e.op2==="Com nome"?`<input type="text" id="nb-${p.id}" data-n="nome" maxlength="${p.opcao2.max}" value="${esc(e.nome)}" placeholder="Até ${p.opcao2.max} letras" autocomplete="off" aria-label="Nome na base">`:""}</div>`:""}
      ${p.cores===3?selCor(p,"c1","Cor da 1ª peça",e)+selCor(p,"c2","Cor da 2ª peça",e)+selCor(p,"c3","Cor da 3ª peça",e):p.cores===2?selCor(p,"c1","Cor da 1ª rena",e)+selCor(p,"c2","Cor da 2ª rena",e):p.cores===1?selCor(p,"cor",p.rotCor||"Cor",e):""}
      ${nomes}
      ${p.peca?"":'<span class="erro" hidden></span>'}
      <div class="linha-add">
        <div class="qtd"><button data-q="-1" aria-label="Diminuir">−</button><span>${e.qtd}</span><button data-q="1" aria-label="Aumentar">+</button></div>
        <button class="btn add" ${preco==null?"disabled":""}>${preco==null?"Em breve":"Colocar na sacola"}</button>
      </div>
    </div>
  </article>`;
}
function renderGrade(){ $("#grade").innerHTML=PRODUTOS.map(cardHTML).join(""); }
function rerenderCard(id,foco){
  const old=document.querySelector(`.prod[data-id="${id}"]`);
  const tmp=document.createElement("div");tmp.innerHTML=cardHTML(prod(id)).trim();
  old.replaceWith(tmp.firstChild);
}
function validar(p,e){
  if(p.opcao2&&e.op2==="Com nome"&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam)&&!e.nome.trim())return "Escreva o nome para a base.";
  if(!p.peca)return "";
  const n=e.nome.trim(),n2=e.nome2.trim();
  if(!n)return "Escreva o nome.";
  if(e.fundo===e.cornome)return "Escolha cores diferentes para a peça e o nome, senão o nome some.";
  if(p.peca==="bengala"){
    if(/\s/.test(n))return "A bengala leva um nome só. Para dois nomes, escolha a bola.";
    if(n.length>9)return "Esse nome passa de 9 letras. Ele fica melhor na bola.";
  }else{
    if(e.letra==="composto"){if(!n2)return "Escreva o 2º nome.";if(n.length>9||n2.length>9)return "Cada nome pode ter até 9 letras.";}
    else{}
  }
  return "";
}
$("#grade").addEventListener("click",ev=>{
  const card=ev.target.closest(".prod");if(!card)return;
  const id=card.dataset.id,e=escolha[id],p=prod(id);
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.foto!==undefined){e.foto=+b.dataset.foto;rerenderCard(id);}
  else if(b.dataset.tam){e.tam=b.dataset.tam;const t=p.tamanhos.find(x=>x.id===e.tam);if(t&&t.soUso)e.op=t.soUso;if(t&&t.foto!=null)e.foto=t.foto;rerenderCard(id);}
  else if(b.dataset.op2){e.op2=b.dataset.op2;rerenderCard(id);}
  else if(b.dataset.op){e.op=b.dataset.op;if(p.opcao.fotos&&p.opcao.fotos[e.op]!=null)e.foto=p.opcao.fotos[e.op];rerenderCard(id);}
  else if(b.dataset.letra){e.letra=b.dataset.letra;rerenderCard(id);}
  else if(b.dataset.mais){e.mais=e.mais||{};e.mais[b.dataset.mais]=true;rerenderCard(id);}
  else if(b.dataset.campo){e[b.dataset.campo]=b.dataset.v;rerenderCard(id);}
  else if(b.dataset.q){e.qtd=Math.max(1,Math.min(50,e.qtd+Number(b.dataset.q)));rerenderCard(id);}
  else if(b.classList.contains("add")){
    if(precoDe(p,e.tam)==null)return;
    const erro=validar(p,e);
    if(erro){const er=card.querySelector(".erro");er.textContent=erro;er.hidden=false;return;}
    const item={pid:id,tam:e.tam,op:e.op,qtd:e.qtd};
    if(p.opcao2&&e.op2==="Com nome"&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam))item.nomeBase=e.nome.trim();
    if(p.cores===3)item.cores=[e.c1,e.c2,e.c3];else if(p.cores===2)item.cores=[e.c1,e.c2];else if(p.cores===1)item.cores=[e.cor];
    if(p.peca)Object.assign(item,{fundo:e.fundo,cornome:e.cornome,letra:p.peca==="bola"?e.letra:"laco",nome:e.nome.trim(),nome2:p.peca==="bola"&&e.letra==="composto"?e.nome2.trim():""});
    const chave=JSON.stringify({...item,qtd:0});
    const ex=sacola.find(i=>JSON.stringify({...i,qtd:0})===chave);
    if(ex)ex.qtd+=e.qtd;else sacola.push(item);
    e.qtd=1;e.nome="";e.nome2="";rerenderCard(id);salvar();renderBarra();toast("Na sacola: "+p.nome);
  }
});
$("#grade").addEventListener("input",ev=>{
  const t=ev.target;if(!t.matches("input[type=text]"))return;
  const card=t.closest(".prod"),id=card.dataset.id,e=escolha[id],p=prod(id);
  e[t.dataset.n]=t.value;
  const pv=card.querySelector(".prev");if(pv){const tmp=document.createElement("div");tmp.innerHTML=previewHTML(p,e);pv.replaceWith(tmp.firstChild);}
  const er=card.querySelector(".erro");if(er)er.hidden=true;
});

function descItem(i){const p=prod(i.pid);const partes=[];const t=p.tamanhos.find(x=>x.id===i.tam);if(p.tamanhos.length>1&&t)partes.push(`tamanho ${t.label}`);if(i.nomeBase)partes.push(`nome na base: ${i.nomeBase}`);if(i.op)partes.push(i.op);if(i.cores)partes.push((i.cores.length>1?"cores: ":"cor: ")+i.cores.join(", "));if(p.peca){const L=LETRAS.find(l=>l.id===i.letra);partes.push(`Nome: ${i.nome}${i.nome2?" "+i.nome2:""}`);if(p.peca==="bola"&&L)partes.push(`letra ${L.label}`);partes.push(`peça ${i.fundo}, nome ${i.cornome}`);}return partes.join(" · ");}

  }
  el.innerHTML=h;
  if(etapa==="pagar"&&pedido&&window.QRCode){try{new QRCode($("#qr"),{text:pedido.pix,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
}

$("#painel").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.classList.contains("fechar"))return fechar();
  if(b.dataset.q&&b.dataset.k!==undefined){const i=sacola[+b.dataset.k];i.qtd=Math.max(1,Math.min(50,i.qtd+Number(b.dataset.q)));salvar();renderBarra();renderPainel();}
  else if(b.dataset.rm!==undefined){sacola.splice(+b.dataset.rm,1);salvar();renderBarra();renderPainel();if(!sacola.length)setTimeout(fechar,600);}
  else if(b.id==="ir-dados"){etapa="dados";renderPainel();}
  else if(b.id==="continuar-ped"){lerDados();
    if(!cliente.nome.trim()||cliente.fone.replace(/\D/g,"").length<10){$("#erro-dados").hidden=false;$("#c-nome").focus();return;}
    salvar();b.disabled=true;b.textContent="Gerando seu pedido…";
    registrar().then(()=>{etapa=cliente.pagamento==="pix"?"pagar":"enviado";renderPainel();$("#painel").scrollTop=0;});}
  else if(b.id==="voltar-dados"){etapa="dados";renderPainel();}
  else if(b.id==="voltar"){lerDados();pedido=null;etapa="sacola";renderPainel();}
  else if(b.id==="copiar")copiar(pedido.pix,"Código Pix copiado","#pix-txt");
  else if(b.id==="copiar-msg")copiar(mensagem(),"Mensagem copiada");
  else if(b.id==="novo"){pedido=null;sacola=[];salvar();renderBarra();fechar();toast("Sacola limpa");}
});
$("#painel").addEventListener("submit",ev=>ev.preventDefault());
$("#painel").addEventListener("change",ev=>{if(ev.target.name==="pag"){lerDados();renderPainel();}});
function lerDados(){const f=$("#form-dados");if(!f)return;cliente.nome=$("#c-nome").value;cliente.fone=$("#c-fone").value;cliente.entrega=$("#c-ent").value;cliente.obs=$("#c-obs").value;const pg=document.querySelector("input[name=pag]:checked");cliente.pagamento=pg?pg.value:"pix";}

function copiar(txt,ok,sel){
  navigator.clipboard.writeText(txt).then(()=>toast(ok)).catch(()=>{
    if(sel){const r=document.createRange();r.selectNodeContents($(sel));const s=getSelection();s.removeAllRanges();s.addRange(r);}
    toast("Selecione e copie manualmente");
  });
}

/* ===== pedido + Pix ===== */
function novoId(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}}
function dadosPedido(){
  const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);
  return {id:pedido.id,cliente:cliente.nome.trim(),whatsapp:cliente.fone.trim(),recebimento:ent?ent.label:"",
    pagamento:cliente.pagamento,total:pedido.total,obs:cliente.obs.trim(),
    itens:sacola.map(i=>{const p=prod(i.pid);return `${i.qtd}x ${p.nome}`+(p.peca?"":(descItem(i)?" · "+descItem(i):""));}).join("\n"),
    nomes:sacola.filter(i=>i.nome).map(i=>`${prod(i.pid).nome.replace(" com nome","")}: ${i.nome}${i.nome2?" "+i.nome2:""} · letra ${(LETRAS.find(l=>l.id===i.letra)||{}).label||""} · peça ${i.fundo}, nome ${i.cornome}`).join("\n")};
}
/* a planilha devolve o número em sequência (ESENATAL-0001...). Se ela não responder, sai um código provisório. */
function jsonp(url,dados,espera){
  return new Promise((ok,falha)=>{
    const cb="clv"+Date.now()+Math.floor(Math.random()*1e4);
    const sc=document.createElement("script");
    const fim=()=>{clearTimeout(t);try{delete window[cb];}catch(e){}sc.remove();};
    const t=setTimeout(()=>{fim();falha(new Error("a planilha demorou mais de 15 s"));},espera);
    window[cb]=r=>{fim();ok(r);};
    sc.onerror=()=>{fim();falha(new Error("a planilha recusou o pedido (confira se a versão nova foi implantada)"));};
    sc.src=url+"?callback="+cb+"&d="+encodeURIComponent(JSON.stringify(dados));
    document.head.appendChild(sc);
  });
}
async function registrar(){
  if(!pedido)pedido={id:novoId(),cod:null};
  pedido.total=total();
  let cod=null;
  const noSite=/github\.io$/.test(location.hostname);
  if(CONFIG.planilha&&noSite){
    for(let t=0;t<2&&!cod;t++){
      try{
        const j=await jsonp(CONFIG.planilha,dadosPedido(),15000);
        if(j&&j.codigo)cod=String(j.codigo);else pedido.erro=(j&&j.erro)||"sem número na resposta";
      }catch(e){pedido.erro=e.message;}
    }
  }else if(!noSite||CONFIG.demo&&!CONFIG.planilha){cod=CONFIG.prefixo+"-TESTE";}
  if(!cod)cod=pedido.cod&&!pedido.cod.includes("-P")?pedido.cod:(CONFIG.prefixo+"-P"+Math.random().toString(36).slice(2,6).toUpperCase().replace(/[01OI]/g,"7"));
  pedido.cod=cod;
  pedido.pix=pixPayload(pedido.total,cod.replace(/[^A-Za-z0-9]/g,""));
}
function tlv(id,v){return id+String(v.length).padStart(2,"0")+v;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,"0");}
function pixPayload(valor,txid){
  const nome=semAcento(CONFIG.pixNome).toUpperCase().slice(0,25);
  const cidade=semAcento(CONFIG.pixCidade).toUpperCase().slice(0,15);
  let p=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",CONFIG.pixChave.trim()))+tlv("52","0000")+tlv("53","986")+tlv("54",valor.toFixed(2))+tlv("58","BR")+tlv("59",nome)+tlv("60",cidade)+tlv("62",tlv("05",txid.slice(0,25)))+"6304";
  return p+crc16(p);
}
function mensagem(){
  const outra=cliente.pagamento==="outra";
  const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);
  const linhas=sacola.map(i=>{const d=descItem(i);return `• ${i.qtd}x ${prod(i.pid).nome}${d?"\n   "+d:""}\n   ${brl(precoItem(i)*i.qtd)}`;});
  return [
    outra?`Oi, Clover! Fiz meu pedido do Natal *E se…?* e quero combinar a forma de pagamento.`
         :`Oi, Clover! Fiz meu pedido do Natal *E se…?* e já paguei pelo Pix. O comprovante vai junto.`,
    ``,`*Pedido ${pedido.cod}*`,...linhas,``,`*Total: ${brl(pedido.total)}*`,`Recebimento: ${ent?ent.label:""}`,
    ``,`Nome: ${cliente.nome.trim()}`,`WhatsApp: ${cliente.fone.trim()}`,cliente.obs.trim()?`Obs.: ${cliente.obs.trim()}`:""
  ].filter((l,k,a)=>!(l===""&&a[k-1]==="")).join("\n").trim();
}
function zapLink(){return pedido?`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(mensagem())}`:`https://wa.me/${CONFIG.whatsapp}`;}

$("#demo").hidden=!CONFIG.demo;

renderGrade();renderBarra();
