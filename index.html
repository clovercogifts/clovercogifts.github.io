<title>E se…? · Natal Clover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: faixa de campanha no topo, vitrine em grade, barra de sacola fixa embaixo, pedido em painel deslizante. Visual único (claro) por escolha: é a paleta da campanha. */
:root{
  --blush:#F7C6CC; --oliva:#C3CC4E; --militar:#3F5B16; --laranja:#FF6B1A; --vinho:#790808;
  --papel:#FFFFFF; --rosa-capa:#FAD7DE; --bege:#FCF5E6; --cartao:#FFFFFF; --tinta:#263510; --tinta-suave:#5B6A45; --linha:#EDDCDC;
  --display:"Borne Celine","Josefin Sans",Georgia,serif;
  --texto:"Josefin Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* prévias das letras das peças: aproximações das fontes de produção */
  --letra-laco:"Allura","Brush Script MT",cursive;
  --letra-qn:"Playfair Display",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--rosa-capa);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.5;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demo{background:var(--militar);color:#fff;font-size:13px;font-weight:600}
.demo .wrap{padding-block:8px}

.topo{position:relative;overflow:hidden;background:var(--rosa-capa)}
.topo .chip{background:#FFFFFF}
.topo .wrap{position:relative;padding-block:28px 12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:end}
.topo-txt{display:grid;gap:12px;padding-bottom:28px}
.marca{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--militar)}
.lettering{width:100%;max-width:520px;height:auto;display:block}
.assina{font-family:var(--display);font-weight:400;font-size:clamp(20px,3vw,26px);color:var(--vinho);margin:0;max-width:26ch;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--blush);color:var(--tinta);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
.qn-topo{width:100%;max-width:340px;justify-self:center;display:block}
.qn-mov{position:relative;transform-origin:50% 8%}
.qn-mov img{width:100%;height:auto;display:block}
.lz{position:absolute;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;opacity:0;--c:255,120,90}
.lz.r{--c:255,90,80}.lz.o{--c:255,170,70}.lz.g{--c:205,240,120}.lz.p{--c:255,190,215}
.lz{background:radial-gradient(circle,rgba(var(--c),.95) 0 22%,rgba(var(--c),.45) 45%,rgba(var(--c),0) 70%)}
@media (prefers-reduced-motion:no-preference){
  .lz{animation:pisca 2.6s ease-in-out infinite;animation-delay:var(--d)}
  .qn-mov{animation:balanca 6s ease-in-out infinite}
  @keyframes pisca{0%,100%{opacity:0}35%,60%{opacity:1}}
  @keyframes balanca{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
}
@media (max-width:640px){.topo .wrap{grid-template-columns:1fr}.qn-topo{max-width:220px;order:-1;margin-bottom:-8px}.topo-txt{padding-bottom:20px}}

.vitrine{padding-block:36px}
.titulo{font-family:var(--display);font-weight:400;text-transform:lowercase}
.titulo::first-letter{text-transform:uppercase;font-size:1.35em;color:var(--vinho)}
.vitrine h2{font-family:var(--display);font-weight:400;font-size:38px;margin:0 0 6px;color:var(--militar)}
.vitrine .sub{margin:0 0 24px;color:var(--tinta-suave);max-width:60ch}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}

.prod{background:var(--cartao);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border:0;box-shadow:0 1px 0 rgba(121,8,8,.08)}
.arte{aspect-ratio:4/3;max-width:100%;width:100%;position:relative;overflow:hidden;background:var(--fundo,#fff);flex:0 0 auto}
.arte img{position:absolute;top:14px;left:14px;width:calc(100% - 28px);height:calc(100% - 28px);max-width:none;object-fit:contain;display:block}
.arte .ex{z-index:1}
.arte .ex{position:absolute;top:10px;left:10px;background:var(--tinta);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}

.corpo{padding:18px;display:flex;flex-direction:column;gap:14px;flex:1}
.corpo h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15}
.corpo p{margin:0;color:var(--tinta-suave);font-size:15px}
.preco{font-weight:800;font-size:22px;color:var(--militar);font-variant-numeric:tabular-nums}
.campo{display:grid;gap:6px}
.rot{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave)}
.opcoes{display:flex;flex-wrap:wrap;gap:6px}
.op{border:2px solid var(--linha);background:var(--papel);border-radius:10px;padding:6px 12px;font-weight:600;font-size:14px}
.op[aria-pressed="true"]{border-color:var(--militar);background:var(--militar);color:#fff}
.cor{width:34px;height:34px;border-radius:50%;border:3px solid var(--cartao);box-shadow:0 0 0 2px var(--linha);padding:0}
.cor[aria-pressed="true"]{box-shadow:0 0 0 3px var(--militar)}
.cor-nome{font-size:13px;color:var(--tinta-suave)}
input[type=text],input[type=tel],textarea,select{width:100%;border:2px solid var(--linha);border-radius:10px;background:var(--papel);padding:10px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--militar);outline:none}
.prev{display:grid;place-items:center;width:132px;height:132px;border-radius:50%;margin:4px auto 0;padding:12px;text-align:center;line-height:1;overflow:hidden;overflow-wrap:anywhere;box-shadow:inset 0 0 0 6px rgba(0,0,0,.06)}
.prev.bengala{width:100%;height:auto;min-height:58px;border-radius:999px;padding:10px 18px}
.prev .l1{display:block}
.prev.laco{font-family:var(--letra-laco);font-size:38px}
.prev.qn{font-family:var(--letra-qn);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.prev.composto{position:relative}
.prev.composto .l1{font-family:var(--letra-qn);font-weight:900;font-size:24px;text-transform:uppercase}
.prev.composto .l2{display:block;font-family:var(--letra-laco);font-size:32px;margin-top:-10px}
.prev-nota{font-size:12px;color:var(--tinta-suave);text-align:center}
.sel-cor{display:flex;gap:6px;flex-wrap:wrap}
.sel-cor .cor{width:28px;height:28px}
.mais-cores{align-self:flex-start;border:0;background:none;padding:2px 0;font-weight:700;font-size:13px;color:var(--militar);text-decoration:underline;text-underline-offset:3px}
.grupo-cor{font-size:11px;color:var(--tinta-suave);margin-top:2px}
.aviso-cor{font-size:12px;color:var(--tinta-suave);background:var(--blush);border-radius:8px;padding:6px 10px}
.breve{position:absolute;inset:auto 12px 12px 12px;background:rgba(255,255,255,.92);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;text-align:center;color:var(--tinta-suave)}
.arte.sem-foto img{opacity:.35}
.arte.com-foto{aspect-ratio:1/1}
.arte.com-foto img{top:0;left:0;width:100%;height:100%;object-fit:cover}
.foto-prox{position:absolute;inset:0;background:none;border:0;padding:0;cursor:pointer;z-index:1}
.fotos-nav{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:2}
.ponto{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.6);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.ponto[aria-pressed="true"]{background:var(--vinho);width:22px;border-radius:5px}
.medida{font-size:14px!important;color:var(--tinta)!important}
.op:disabled{opacity:.4;cursor:not-allowed}
.sem-preco{font-size:16px;font-weight:700;color:var(--tinta-suave)}
.rodape{padding-block:20px 36px}
.rodape .wrap{display:grid;gap:18px;justify-items:center;text-align:center}
.boia{width:min(260px,70%);height:auto}
.rodape p{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,30px);color:var(--vinho);max-width:22ch;line-height:1.2}
.elenco{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:14px 20px;max-width:900px}
.elenco img{height:84px;width:auto;max-width:110px;object-fit:contain}
.elenco img:nth-child(odd){transform:rotate(-4deg)}
.elenco img:nth-child(3n){transform:rotate(5deg)}
.assina-rodape{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--militar)}
@media (max-width:640px){.elenco img{height:60px;max-width:80px}}
.dica{font-size:13px;color:var(--tinta-suave)}
.linha-add{display:flex;gap:10px;align-items:center;margin-top:auto}
.qtd{display:flex;align-items:center;border:2px solid var(--linha);border-radius:10px;overflow:hidden}
.qtd button{width:36px;height:40px;border:0;background:var(--papel);font-size:18px;font-weight:700}
.qtd span{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--vinho);color:#fff;flex:1}
.btn:hover{filter:brightness(.95)}
.btn.verde{background:var(--militar)}
.btn.claro{background:var(--papel);color:var(--militar);border:2px solid var(--militar)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.op-pag{display:flex;align-items:center;gap:8px;border:2px solid var(--linha);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.op-pag:has(input:checked){border-color:var(--militar)}
.erro{color:var(--vinho);font-size:13px;font-weight:600}

.barra{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--militar);color:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.barra .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.barra .tot{flex:1;min-width:0}
.barra .tot small{display:block;opacity:.8;font-size:13px}
.barra .tot strong{font-size:20px;font-variant-numeric:tabular-nums}
.barra .btn{flex:0 0 auto;background:var(--oliva);color:var(--tinta)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px}

.veu{position:fixed;inset:0;background:rgba(38,53,16,.45);z-index:40}
.painel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--papel);z-index:41;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.painel .in{padding:20px max(20px,env(safe-area-inset-left,0px)) 40px 20px;display:grid;gap:22px}
.cab{display:flex;justify-content:space-between;align-items:center;gap:12px}
.cab h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--vinho)}
.fechar{border:0;background:var(--blush);color:var(--tinta);border-radius:999px;width:40px;height:40px;font-size:20px;font-weight:700}
.passos{display:flex;gap:6px;font-size:13px;font-weight:700}
.passos span{flex:1;text-align:center;padding:6px 4px;border-radius:8px;background:var(--linha);color:var(--tinta-suave)}
.passos span.on{background:var(--militar);color:#fff}
.itens{display:grid;gap:10px}
.item{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.item .n{font-weight:700}
.item .d{font-size:14px;color:var(--tinta-suave);grid-column:1}
.item .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.item .acoes{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:4px}
.item .acoes .qtd button{height:32px;width:32px}
.remover{border:0;background:none;color:var(--vinho);font-weight:700;font-size:14px;margin-left:auto}
.somas{background:var(--cartao);border-radius:14px;padding:14px;display:grid;gap:6px;font-variant-numeric:tabular-nums;border:1px solid var(--linha)}
.somas div{display:flex;justify-content:space-between}
.somas .grande{font-size:20px;font-weight:800;color:var(--militar);border-top:2px dashed var(--linha);padding-top:8px}
.form{display:grid;gap:14px}
.vazio{text-align:center;padding:30px 10px;color:var(--tinta-suave)}
.pix{background:var(--cartao);border-radius:16px;padding:18px;display:grid;gap:14px;justify-items:center;border:1px solid var(--linha)}
.pix .codigo{font-size:12px;word-break:break-all;background:var(--papel);border:1px dashed var(--linha);border-radius:10px;padding:10px;width:100%;font-family:ui-monospace,Menlo,monospace}
#qr{background:#fff;padding:10px;border-radius:12px}
#qr img,#qr canvas{display:block}
.pedido-cod{font-family:var(--texto);font-weight:700;letter-spacing:.04em;font-size:26px;color:var(--militar)}
.aviso{background:var(--blush);border-radius:12px;padding:12px 14px;font-size:14px}
.zap{font-size:14px;color:var(--tinta-suave);text-align:center}
.zap code{font-weight:700;color:var(--tinta)}
.grupo-btn{display:grid;gap:10px}
.grupo-btn a.btn{text-align:center;text-decoration:none;display:block}

@media (prefers-reduced-motion:no-preference){
  .painel{animation:entra .25s ease-out}
  @keyframes entra{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}

const escolha = {};
PRODUTOS.forEach(p=>escolha[p.id]={tam:p.tamanhos[0].id,op:p.opcao?p.opcao.vals[0]:"",fundo:"Rosa pastel",cornome:"Vermelho",c1:"Rosa pastel",c2:"Verde oliva candy",c3:"Laranja",cor:p.corPadrao||"Rosa pastel",op2:p.opcao2?p.opcao2.vals[0]:"",letra:"laco",nome:"",nome2:"",qtd:1});
let sacola = [];
let etapa = "sacola"; // sacola | dados | pagar
let cliente = {nome:"",fone:"",entrega:"retirada",obs:"",pagamento:"pix"};
let pedido = null;
const prod = id => PRODUTOS.find(p=>p.id===id);
const precoDe = (p,tam) => (p.tamanhos.find(t=>t.id===tam)||p.tamanhos[0]).preco;
try{const s=JSON.parse(localStorage.getItem("ese-sacola2")||"null");if(Array.isArray(s))sacola=s.filter(i=>prod(i.pid)&&precoDe(prod(i.pid),i.tam)!=null);}catch(e){}
try{const c=JSON.parse(localStorage.getItem("ese-cliente")||"null");if(c)cliente=Object.assign(cliente,c);}catch(e){}
function salvar(){if(etapa!=="pagar")pedido=pedido&&etapa==="dados"?pedido:null;try{localStorage.setItem("ese-sacola2",JSON.stringify(sacola));localStorage.setItem("ese-cliente",JSON.stringify(cliente));}catch(e){}}

const precoItem = i => precoDe(prod(i.pid),i.tam);
const subtotal = () => sacola.reduce((s,i)=>s+precoItem(i)*i.qtd,0);
const totalQtd = () => sacola.reduce((s,i)=>s+i.qtd,0);

/* ===== vitrine ===== */
function previewHTML(p,e){
  const st=`background:${fundoFil(e.fundo)};color:${hexFil(e.cornome)}`;
  const cls=`prev ${p.peca==="bengala"?"bengala":""} ${p.peca==="bengala"?"laco":e.letra}`;
  if(p.peca==="bola"&&e.letra==="composto")
    return `<div class="${cls}" style="${st}"><span><span class="l1">${esc(e.nome||"Maria")}</span><span class="l2">${esc(e.nome2||"Eduarda")}</span></span></div>`;
  return `<div class="${cls}" style="${st}"><span class="l1">${esc(e.nome||"Seu nome")}</span></div>`;
}
function selCor(p,campo,rot,e){
  const v=e[campo],f=FIL.find(x=>x.n===v)||{};
  const aberto=!!(e.mais&&e.mais[campo])||!f.c;
  const bt=x=>`<button class="cor" data-campo="${campo}" data-v="${esc(x.n)}" style="background:${x.h}" aria-label="${esc(x.n)}" aria-pressed="${x.n===v}" title="${esc(x.n)}"></button>`;
  return `<div class="campo"><span class="rot">${rot}: <span style="text-transform:none;letter-spacing:0">${esc(v)}</span></span>
    <div class="sel-cor">${FIL.filter(x=>x.c).map(bt).join("")}</div>
    ${aberto?`<span class="grupo-cor">Outras cores</span><div class="sel-cor">${FIL.filter(x=>!x.c).map(bt).join("")}</div>`
            :`<button class="mais-cores" data-mais="${campo}">+ ver mais ${FIL.filter(x=>!x.c).length} cores</button>`}
    ${f.teste?`<span class="aviso-cor">Essa cor muda bastante com a luz. A gente confirma com você pelo WhatsApp antes de imprimir.</span>`:""}</div>`;
}
function cardHTML(p){
  const e=escolha[p.id];
  const preco=precoDe(p,e.tam);
  const tSel=p.tamanhos.find(t=>t.id===e.tam)||p.tamanhos[0];
  const nomes=p.peca?`
      ${p.peca==="bola"?`<div class="campo"><span class="rot">Letra</span><div class="opcoes">${LETRAS.map(l=>`<button class="op" data-letra="${l.id}" aria-pressed="${l.id===e.letra}">${l.label} <small>· ${l.dica}</small></button>`).join("")}</div></div>`:""}
      <div class="campo"><label class="rot" for="nome-${p.id}">${p.peca==="bola"&&e.letra==="composto"?"1º nome":"Nome"}</label>
        <input type="text" id="nome-${p.id}" data-n="nome" maxlength="${p.peca==="bola"&&e.letra!=="composto"?19:p.maxLetras}" value="${esc(e.nome)}" placeholder="${p.peca==="bengala"?"Até 9 letras":"Até 2 linhas de 9 letras"}" autocomplete="off"></div>
      ${p.peca==="bola"&&e.letra==="composto"?`<div class="campo"><label class="rot" for="nome2-${p.id}">2º nome</label><input type="text" id="nome2-${p.id}" data-n="nome2" maxlength="9" value="${esc(e.nome2)}" autocomplete="off"></div>`:""}
      ${selCor(p,"fundo","Cor da peça",e)}
      ${selCor(p,"cornome",p.peca==="bola"?"Cor do nome e da borda":"Cor do nome",e)}
      ${previewHTML(p,e)}
      <span class="prev-nota">Prévia aproximada. A letra e a cor do filamento podem variar um pouco.</span>
      <span class="erro" hidden></span>`:"";
  return `
  <article class="prod" data-id="${p.id}">
    <div class="arte ${p.foto?"com-foto":(p.peca?"":"sem-foto")}" style="--fundo:${p.fundo}"><img src="assets/${p.imgs?p.imgs[e.foto||0]:p.img}" alt="${esc(p.nome)}" loading="lazy">${p.imgs&&p.imgs.length>1?`<div class="fotos-nav">${p.imgs.map((_,k)=>`<button class="ponto" data-foto="${k}" aria-label="Foto ${k+1} de ${p.imgs.length}" aria-pressed="${k===(e.foto||0)}"></button>`).join("")}</div><button class="foto-prox" data-foto="${((e.foto||0)+1)%p.imgs.length}" aria-label="Próxima foto"></button>`:""}${p.foto||p.peca?"":'<span class="breve">Foto da peça em breve</span>'}</div>
    <div class="corpo">
      <h3>${esc(p.nome)}</h3>
      <p>${esc(p.desc)}</p>
      <p class="medida"><strong>Tamanho:</strong> ${esc(tSel.medida)}</p>
      ${preco==null?'<div class="sem-preco">Preço em breve</div>':`<div class="preco">${brl(preco)}</div>`}
      ${p.tamanhos.length>1?`<div class="campo"><span class="rot">Tamanho</span><div class="opcoes">${p.tamanhos.map(t=>`<button class="op" data-tam="${t.id}" aria-pressed="${t.id===e.tam}">${esc(t.label)}${t.preco!=null?` <small>· ${brl(t.preco)}</small>`:""}</button>`).join("")}</div></div>`:""}
      ${p.opcao?`<div class="campo"><span class="rot">${esc(p.opcao.rot)}</span><div class="opcoes">${p.opcao.vals.map(v=>`<button class="op" data-op="${esc(v)}" aria-pressed="${v===e.op}" ${tSel.soUso&&v!==tSel.soUso?"disabled":""}>${esc(v)}</button>`).join("")}</div></div>`:""}
      ${p.opcao2&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam)?`<div class="campo"><span class="rot">${esc(p.opcao2.rot)}</span><div class="opcoes">${p.opcao2.vals.map(v=>`<button class="op" data-op2="${esc(v)}" aria-pressed="${v===e.op2}">${esc(v)}</button>`).join("")}</div>
        ${e.op2==="Com nome"?`<input type="text" id="nb-${p.id}" data-n="nome" maxlength="${p.opcao2.max}" value="${esc(e.nome)}" placeholder="Até ${p.opcao2.max} letras" autocomplete="off" aria-label="Nome na base">`:""}</div>`:""}
      ${p.cores===3?selCor(p,"c1","Cor da 1ª peça",e)+selCor(p,"c2","Cor da 2ª peça",e)+selCor(p,"c3","Cor da 3ª peça",e):p.cores===1?selCor(p,"cor",p.rotCor||"Cor",e):""}
      ${nomes}
      ${p.peca?"":'<span class="erro" hidden></span>'}
      <div class="linha-add">
        <div class="qtd"><button data-q="-1" aria-label="Diminuir">−</button><span>${e.qtd}</span><button data-q="1" aria-label="Aumentar">+</button></div>
        <button class="btn add" ${preco==null?"disabled":""}>${preco==null?"Em breve":"Colocar na sacola"}</button>
      </div>
    </div>
  </article>`;
}
function renderGrade(){ $("#grade").innerHTML=PRODUTOS.map(cardHTML).join(""); }
function rerenderCard(id,foco){
  const old=document.querySelector(`.prod[data-id="${id}"]`);
  const tmp=document.createElement("div");tmp.innerHTML=cardHTML(prod(id)).trim();
  old.replaceWith(tmp.firstChild);
}
function validar(p,e){
  if(p.opcao2&&e.op2==="Com nome"&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam)&&!e.nome.trim())return "Escreva o nome para a base.";
  if(!p.peca)return "";
  const n=e.nome.trim(),n2=e.nome2.trim();
  if(!n)return "Escreva o nome.";
  if(e.fundo===e.cornome)return "Escolha cores diferentes para a peça e o nome, senão o nome some.";
  if(p.peca==="bengala"){
    if(/\s/.test(n))return "A bengala leva um nome só. Para dois nomes, escolha a bola.";
    if(n.length>9)return "Esse nome passa de 9 letras. Ele fica melhor na bola.";
  }else{
    if(e.letra==="composto"){if(!n2)return "Escreva o 2º nome.";if(n.length>9||n2.length>9)return "Cada nome pode ter até 9 letras.";}
    else{const pal=n.split(/\s+/);if(pal.length>2)return "Na bola cabem até 2 linhas.";if(pal.some(w=>w.length>9))return "Cada linha pode ter até 9 letras.";}
  }
  return "";
}
$("#grade").addEventListener("click",ev=>{
  const card=ev.target.closest(".prod");if(!card)return;
  const id=card.dataset.id,e=escolha[id],p=prod(id);
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.foto!==undefined){e.foto=+b.dataset.foto;rerenderCard(id);}
  else if(b.dataset.tam){e.tam=b.dataset.tam;const t=p.tamanhos.find(x=>x.id===e.tam);if(t&&t.soUso)e.op=t.soUso;if(t&&t.foto!=null)e.foto=t.foto;rerenderCard(id);}
  else if(b.dataset.op2){e.op2=b.dataset.op2;rerenderCard(id);}
  else if(b.dataset.op){e.op=b.dataset.op;rerenderCard(id);}
  else if(b.dataset.letra){e.letra=b.dataset.letra;rerenderCard(id);}
  else if(b.dataset.mais){e.mais=e.mais||{};e.mais[b.dataset.mais]=true;rerenderCard(id);}
  else if(b.dataset.campo){e[b.dataset.campo]=b.dataset.v;rerenderCard(id);}
  else if(b.dataset.q){e.qtd=Math.max(1,Math.min(50,e.qtd+Number(b.dataset.q)));rerenderCard(id);}
  else if(b.classList.contains("add")){
    if(precoDe(p,e.tam)==null)return;
    const erro=validar(p,e);
    if(erro){const er=card.querySelector(".erro");er.textContent=erro;er.hidden=false;return;}
    const item={pid:id,tam:e.tam,op:e.op,qtd:e.qtd};
    if(p.opcao2&&e.op2==="Com nome"&&(!p.opcao2.soTam||p.opcao2.soTam===e.tam))item.nomeBase=e.nome.trim();
    if(p.cores===3)item.cores=[e.c1,e.c2,e.c3];else if(p.cores===1)item.cores=[e.cor];
    if(p.peca)Object.assign(item,{fundo:e.fundo,cornome:e.cornome,letra:p.peca==="bola"?e.letra:"laco",nome:e.nome.trim(),nome2:p.peca==="bola"&&e.letra==="composto"?e.nome2.trim():""});
    const chave=JSON.stringify({...item,qtd:0});
    const ex=sacola.find(i=>JSON.stringify({...i,qtd:0})===chave);
    if(ex)ex.qtd+=e.qtd;else sacola.push(item);
    e.qtd=1;e.nome="";e.nome2="";rerenderCard(id);salvar();renderBarra();toast("Na sacola: "+p.nome);
  }
});
$("#grade").addEventListener("input",ev=>{
  const t=ev.target;if(!t.matches("input[type=text]"))return;
  const card=t.closest(".prod"),id=card.dataset.id,e=escolha[id],p=prod(id);
  e[t.dataset.n]=t.value;
  const pv=card.querySelector(".prev");if(pv){const tmp=document.createElement("div");tmp.innerHTML=previewHTML(p,e);pv.replaceWith(tmp.firstChild);}
  const er=card.querySelector(".erro");if(er)er.hidden=true;
});

/* ===== barra ===== */
function renderBarra(){
  const q=totalQtd();
  $("#barra-qtd").textContent=q?`${q} ${q===1?"item":"itens"} na sacola`:"Sacola vazia";
  $("#barra-total").textContent=brl(subtotal());
  $("#abrir").disabled=!q;
}

/* ===== painel ===== */
function abrir(){etapa=pedido?(cliente.pagamento==="pix"?"pagar":"enviado"):"sacola";$("#veu").hidden=false;$("#painel").hidden=false;renderPainel();$("#painel .fechar")?.focus();}
function fechar(){$("#veu").hidden=true;$("#painel").hidden=true;}
$("#abrir").onclick=abrir;$("#veu").onclick=fechar;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#painel").hidden)fechar();});

function passos(){const ps=[["sacola","Sacola"],["dados","Seus dados"],["pagar","Pagamento"]];return `<div class="passos">${ps.map(([k,l])=>`<span class="${k===etapa?"on":""}">${l}</span>`).join("")}</div>`;}
function descItem(i){const p=prod(i.pid);const partes=[];const t=p.tamanhos.find(x=>x.id===i.tam);if(p.tamanhos.length>1&&t)partes.push(`tamanho ${t.label}`);if(i.nomeBase)partes.push(`nome na base: ${i.nomeBase}`);if(i.op)partes.push(i.op);if(i.cores)partes.push((i.cores.length>1?"cores: ":"cor: ")+i.cores.join(", "));if(p.peca){const L=LETRAS.find(l=>l.id===i.letra);partes.push(`Nome: ${i.nome}${i.nome2?" "+i.nome2:""}`);if(p.peca==="bola"&&L)partes.push(`letra ${L.label}`);partes.push(`peça ${i.fundo}, nome ${i.cornome}`);}return partes.join(" · ");}
function somasHTML(){
  const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);
  return `<div class="somas"><div><span>Produtos</span><span>${brl(subtotal())}</span></div>
  ${etapa!=="sacola"&&ent?`<div><span>${esc(ent.label)}</span><span>${ent.obs?esc(ent.obs):(ent.taxa?brl(ent.taxa):"sem custo")}</span></div>`:""}
  <div class="grande"><span>Total</span><span>${brl(total())}</span></div></div>`;
}
function total(){const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);return subtotal()+(etapa!=="sacola"&&ent?ent.taxa:0);}

function renderPainel(){
  const el=$("#painel-in");
  let h=`<div class="cab"><h2 class="titulo">Seu pedido</h2><button class="fechar" aria-label="Fechar">×</button></div>${passos()}`;
  if(etapa==="sacola"){
    if(!sacola.length){h+=`<div class="vazio">Sua sacola está vazia.<br>Escolha uma peça na coleção.</div>`;}
    else{
      h+=`<div class="itens">${sacola.map((i,k)=>`<div class="item"><span class="n">${esc(prod(i.pid).nome)}</span><span class="v">${brl(precoItem(i)*i.qtd)}</span><span class="d">${esc(descItem(i))}</span>
      <div class="acoes"><div class="qtd"><button data-k="${k}" data-q="-1" aria-label="Diminuir">−</button><span>${i.qtd}</span><button data-k="${k}" data-q="1" aria-label="Aumentar">+</button></div><button class="remover" data-rm="${k}">Remover</button></div></div>`).join("")}</div>
      ${somasHTML()}<button class="btn verde" id="ir-dados">Continuar</button>`;
    }
  }else if(etapa==="dados"){
    h+=`<form class="form" id="form-dados" novalidate>
      <div class="campo"><label class="rot" for="c-nome">Seu nome</label><input type="text" id="c-nome" required value="${esc(cliente.nome)}" autocomplete="name"></div>
      <div class="campo"><label class="rot" for="c-fone">WhatsApp</label><input type="tel" id="c-fone" required value="${esc(cliente.fone)}" placeholder="(45) 9 9999-9999" autocomplete="tel"></div>
      <div class="campo"><label class="rot" for="c-ent">Como quer receber</label><select id="c-ent">${CONFIG.entregas.map(x=>`<option value="${x.id}" ${x.id===cliente.entrega?"selected":""}>${esc(x.label)}</option>`).join("")}</select></div>
      <div class="campo"><label class="rot" for="c-obs">Observações (opcional)</label><textarea id="c-obs" rows="3" placeholder="Endereço, data que precisa, algum detalhe…">${esc(cliente.obs)}</textarea></div>
      <div class="campo"><span class="rot">Pagamento</span>
        <div class="opcoes" role="radiogroup">
          <label class="op-pag"><input type="radio" name="pag" value="pix" ${cliente.pagamento==="pix"?"checked":""}> Pix agora</label>
          <label class="op-pag"><input type="radio" name="pag" value="outra" ${cliente.pagamento==="outra"?"checked":""}> Combinar outra forma</label>
        </div>
      </div>
      <span class="erro" id="erro-dados" hidden>Preencha seu nome e WhatsApp.</span>
      ${somasHTML()}
      <div class="grupo-btn"><button class="btn verde" type="button" id="continuar-ped">${cliente.pagamento==="pix"?"Ir para o pagamento":"Continuar"}</button>
      <button class="btn claro" type="button" id="voltar">Voltar para a sacola</button></div>
    </form>`;
  }else if(etapa==="pagar"&&pedido){
    h+=`<div class="pix">
      <span class="rot">Pedido</span><span class="pedido-cod">${pedido.cod}</span>
      <div class="preco">${brl(pedido.total)}</div>
      ${CONFIG.demo&&pedido.erro&&pedido.cod.includes("-P")?`<div class="aviso"><strong>Teste: a planilha não gravou.</strong> Motivo: ${esc(pedido.erro)}</div>`:""}
      ${CONFIG.demo?`<div class="aviso"><strong>Pix de demonstração.</strong> Não pague: a chave ainda não é a real.</div>`:""}
      <span class="rot">1 · Pague com Pix</span>
      <div id="qr" aria-label="QR Code do Pix"></div>
      <div class="codigo" id="pix-txt">${esc(pedido.pix)}</div>
      <button class="btn verde" id="copiar">Copiar código Pix</button>
      <span class="dica" style="text-align:center">No app do banco, escolha Pix copia e cola. O valor já vem preenchido.</span>
    </div>
    <div class="pix">
      <span class="rot">2 · Envie o pedido e o comprovante</span>
      <a class="btn" style="width:100%;text-align:center;text-decoration:none" href="${zapLink()}" target="_blank" rel="noopener">Já paguei · enviar no WhatsApp</a>
      <span class="dica" style="text-align:center">O WhatsApp abre com o pedido escrito. Anexe o comprovante na mesma conversa e toque em enviar.</span>
    </div>
    <div class="grupo-btn">
      <button class="btn claro" id="copiar-msg">Copiar mensagem do pedido</button>
      <button class="btn claro" type="button" id="voltar-dados">Voltar e mudar meus dados</button>
    </div>
    <p class="zap">Se o WhatsApp não abrir, mande a mensagem para <code>${esc(CONFIG.whatsappExibir)}</code>.</p>
    <button class="btn claro" id="novo">Fazer outro pedido</button>`;
  }else if(etapa==="enviado"&&pedido){
    h+=`<div class="pix"><span class="rot">Pedido</span><span class="pedido-cod">${pedido.cod}</span><div class="preco">${brl(pedido.total)}</div>
      <a class="btn" style="width:100%;text-align:center;text-decoration:none" href="${zapLink()}" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
      <span class="dica" style="text-align:center">O WhatsApp abre com o pedido escrito. Toque em enviar e a gente combina o pagamento por lá.</span></div>
    <div class="grupo-btn">
      <button class="btn claro" type="button" id="voltar-dados">Voltar e mudar meus dados</button>
      <button class="btn claro" id="copiar-msg">Copiar mensagem do pedido</button>
    </div>
    <p class="zap">Se o WhatsApp não abrir, mande a mensagem para <code>${esc(CONFIG.whatsappExibir)}</code>.</p>
    <button class="btn claro" id="novo">Fazer outro pedido</button>`;
  }
  el.innerHTML=h;
  if(etapa==="pagar"&&pedido&&window.QRCode){try{new QRCode($("#qr"),{text:pedido.pix,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});}catch(e){}}
}

$("#painel").addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.classList.contains("fechar"))return fechar();
  if(b.dataset.q&&b.dataset.k!==undefined){const i=sacola[+b.dataset.k];i.qtd=Math.max(1,Math.min(50,i.qtd+Number(b.dataset.q)));salvar();renderBarra();renderPainel();}
  else if(b.dataset.rm!==undefined){sacola.splice(+b.dataset.rm,1);salvar();renderBarra();renderPainel();if(!sacola.length)setTimeout(fechar,600);}
  else if(b.id==="ir-dados"){etapa="dados";renderPainel();}
  else if(b.id==="continuar-ped"){lerDados();
    if(!cliente.nome.trim()||cliente.fone.replace(/\D/g,"").length<10){$("#erro-dados").hidden=false;$("#c-nome").focus();return;}
    salvar();b.disabled=true;b.textContent="Gerando seu pedido…";
    registrar().then(()=>{etapa=cliente.pagamento==="pix"?"pagar":"enviado";renderPainel();$("#painel").scrollTop=0;});}
  else if(b.id==="voltar-dados"){etapa="dados";renderPainel();}
  else if(b.id==="voltar"){lerDados();pedido=null;etapa="sacola";renderPainel();}
  else if(b.id==="copiar")copiar(pedido.pix,"Código Pix copiado","#pix-txt");
  else if(b.id==="copiar-msg")copiar(mensagem(),"Mensagem copiada");
  else if(b.id==="novo"){pedido=null;sacola=[];salvar();renderBarra();fechar();toast("Sacola limpa");}
});
$("#painel").addEventListener("submit",ev=>ev.preventDefault());
$("#painel").addEventListener("change",ev=>{if(ev.target.name==="pag"){lerDados();renderPainel();}});
function lerDados(){const f=$("#form-dados");if(!f)return;cliente.nome=$("#c-nome").value;cliente.fone=$("#c-fone").value;cliente.entrega=$("#c-ent").value;cliente.obs=$("#c-obs").value;const pg=document.querySelector("input[name=pag]:checked");cliente.pagamento=pg?pg.value:"pix";}

function copiar(txt,ok,sel){
  navigator.clipboard.writeText(txt).then(()=>toast(ok)).catch(()=>{
    if(sel){const r=document.createRange();r.selectNodeContents($(sel));const s=getSelection();s.removeAllRanges();s.addRange(r);}
    toast("Selecione e copie manualmente");
  });
}

/* ===== pedido + Pix ===== */
function novoId(){try{return crypto.randomUUID();}catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2,10);}}
function dadosPedido(){
  const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);
  return {id:pedido.id,cliente:cliente.nome.trim(),whatsapp:cliente.fone.trim(),recebimento:ent?ent.label:"",
    pagamento:cliente.pagamento,total:pedido.total,obs:cliente.obs.trim(),
    itens:sacola.map(i=>{const p=prod(i.pid);return `${i.qtd}x ${p.nome}`+(p.peca?"":(descItem(i)?" · "+descItem(i):""));}).join("\n"),
    nomes:sacola.filter(i=>i.nome).map(i=>`${prod(i.pid).nome.replace(" com nome","")}: ${i.nome}${i.nome2?" "+i.nome2:""} · letra ${(LETRAS.find(l=>l.id===i.letra)||{}).label||""} · peça ${i.fundo}, nome ${i.cornome}`).join("\n")};
}
/* a planilha devolve o número em sequência (ESENATAL-0001...). Se ela não responder, sai um código provisório. */
function jsonp(url,dados,espera){
  return new Promise((ok,falha)=>{
    const cb="clv"+Date.now()+Math.floor(Math.random()*1e4);
    const sc=document.createElement("script");
    const fim=()=>{clearTimeout(t);try{delete window[cb];}catch(e){}sc.remove();};
    const t=setTimeout(()=>{fim();falha(new Error("a planilha demorou mais de 15 s"));},espera);
    window[cb]=r=>{fim();ok(r);};
    sc.onerror=()=>{fim();falha(new Error("a planilha recusou o pedido (confira se a versão nova foi implantada)"));};
    sc.src=url+"?callback="+cb+"&d="+encodeURIComponent(JSON.stringify(dados));
    document.head.appendChild(sc);
  });
}
async function registrar(){
  if(!pedido)pedido={id:novoId(),cod:null};
  pedido.total=total();
  let cod=null;
  const noSite=/github\.io$/.test(location.hostname);
  if(CONFIG.planilha&&noSite){
    for(let t=0;t<2&&!cod;t++){
      try{
        const j=await jsonp(CONFIG.planilha,dadosPedido(),15000);
        if(j&&j.codigo)cod=String(j.codigo);else pedido.erro=(j&&j.erro)||"sem número na resposta";
      }catch(e){pedido.erro=e.message;}
    }
  }else if(!noSite||CONFIG.demo&&!CONFIG.planilha){cod=CONFIG.prefixo+"-TESTE";}
  if(!cod)cod=pedido.cod&&!pedido.cod.includes("-P")?pedido.cod:(CONFIG.prefixo+"-P"+Math.random().toString(36).slice(2,6).toUpperCase().replace(/[01OI]/g,"7"));
  pedido.cod=cod;
  pedido.pix=pixPayload(pedido.total,cod.replace(/[^A-Za-z0-9]/g,""));
}
function tlv(id,v){return id+String(v.length).padStart(2,"0")+v;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,"0");}
function pixPayload(valor,txid){
  const nome=semAcento(CONFIG.pixNome).toUpperCase().slice(0,25);
  const cidade=semAcento(CONFIG.pixCidade).toUpperCase().slice(0,15);
  let p=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",CONFIG.pixChave.trim()))+tlv("52","0000")+tlv("53","986")+tlv("54",valor.toFixed(2))+tlv("58","BR")+tlv("59",nome)+tlv("60",cidade)+tlv("62",tlv("05",txid.slice(0,25)))+"6304";
  return p+crc16(p);
}
function mensagem(){
  const outra=cliente.pagamento==="outra";
  const ent=CONFIG.entregas.find(x=>x.id===cliente.entrega);
  const linhas=sacola.map(i=>{const d=descItem(i);return `• ${i.qtd}x ${prod(i.pid).nome}${d?"\n   "+d:""}\n   ${brl(precoItem(i)*i.qtd)}`;});
  return [
    outra?`Oi, Clover! Fiz meu pedido do Natal *E se…?* e quero combinar a forma de pagamento.`
         :`Oi, Clover! Fiz meu pedido do Natal *E se…?* e já paguei pelo Pix. O comprovante vai junto.`,
    ``,`*Pedido ${pedido.cod}*`,...linhas,``,`*Total: ${brl(pedido.total)}*`,`Recebimento: ${ent?ent.label:""}`,
    ``,`Nome: ${cliente.nome.trim()}`,`WhatsApp: ${cliente.fone.trim()}`,cliente.obs.trim()?`Obs.: ${cliente.obs.trim()}`:""
  ].filter((l,k,a)=>!(l===""&&a[k-1]==="")).join("\n").trim();
}
function zapLink(){return pedido?`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(mensagem())}`:`https://wa.me/${CONFIG.whatsapp}`;}

/* ===== início ===== */
$("#demo").hidden=!CONFIG.demo;
$("#chip-prazo").textContent="Pedidos até "+CONFIG.prazo;
renderGrade();renderBarra();
</script>
